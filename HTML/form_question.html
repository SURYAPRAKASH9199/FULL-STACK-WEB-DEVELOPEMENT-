<!DOCTYPE html>
<html>
<head>
    <style>
        h1 {
            color: navy;
        }
        button {
            color: blue;
            background-color: lightgrey; /* 'light silver' ko 'lightgrey' kiya */
        }
    </style>
    <title>Program</title>
</head>
<body>

    <h1># First Program Using CSS</h1>
    <h3># These Links Are Created For Your Help</h3> <form action="https://www.google.com/search" method="GET">
        <div>
            <label for="Google">Google:</label>
            <input type="text" id="Google" placeholder="search" name="q"/>
            <button type="submit">search</button> </div>
    </form>
    
    <br>

    <form action="https://www.youtube.com/results" method="GET">
        <div>
            <label for="Youtube">Youtube:</label>
            <input type="text" id="Youtube" placeholder="search" name="search_query"/>
            <button type="submit">search</button>
        </div>
    </form>

    <br>

    <form action="https://www.linkedin.com/search/results/all/" method="GET">
        <div>
            <label for="linkedin">linkedin:</label>
            <input type="text" id="linkedin" placeholder="search" name="keywords"/> <button type="submit">search</button> </div>
    </form>

</body>
</html>
